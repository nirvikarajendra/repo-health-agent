name: CI                         

on:                              
  push:
    branches: [main]            
  pull_request:  
    branches: [main]                 

permissions:
  contents: read                 

jobs:
  lint-and-test:                
    runs-on: ubuntu-latest       
    services:
      postgres:                    # Throwaway database for the real-Postgres tests
        image: pgvector/pgvector:0.8.7-pg18   
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test   
          POSTGRES_DB: repo_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d repo_health_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7         
      - uses: astral-sh/setup-uv@v9.0.0   
      - name: Install dependencies
        run: uv sync --locked             
      - name: Lint
        run: uv run ruff check .           
      - name: Check formatting
        run: uv run ruff format --check . 
      - name: Tests
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/repo_health_test

  secret-scan:                  
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                  
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   